<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Character Poser</title>
  <meta name="apple-mobile-web-app-title" content="Character Poser" />
  <link rel="apple-touch-icon" href="./public/icon.png" />
  <link rel="stylesheet" href="./static-viewer.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <p class="eyebrow">3D character viewer</p>
      <h1 id="appTitle">Character Poser</h1>
      <p class="subtitle">Simple standalone viewer with preset poses.</p>

      <details class="panel collapsible-panel" open>
        <summary>Status</summary>
        <div id="status" class="status">Booting viewer…</div>
        <button id="resetCameraBtn" class="character-chip" type="button" style="margin-top:12px;">Reset Camera</button>
      </details>

      <details class="panel collapsible-panel" open>
        <summary>Character</summary>
        <div id="characterList" class="character-list"></div>
      </details>

      <details class="panel collapsible-panel" open>
        <summary>Current pose</summary>
        <strong id="poseName">Idle</strong>
        <p id="poseDescription">Neutral standing showcase pose.</p>
      </details>

      <details class="panel collapsible-panel">
        <summary>Pose Tuner</summary>
        <div id="tunerControls" class="tuner-controls"></div>
      </details>
    </aside>

    <main class="viewer-column">
      <div id="viewerFrame" class="viewer-frame">
        <canvas id="viewer"></canvas>
        <button id="fullscreenToggleBtn" class="fullscreen-toggle" type="button">Fullscreen Viewer</button>
      </div>
      <div id="mobileFullscreenHint" style="display:none;"></div>
      <section id="posePanel" class="pose-panel"></section>
    </main>
  </div>

  <script>
    document.getElementById('status').textContent = 'Inline script started.';
    window.addEventListener('error', function (event) {
      const status = document.getElementById('status');
      status.textContent = 'JS error: ' + (event.message || 'unknown error');
    });
  </script>
  <script type="module" src="./static-viewer.js"></script>
</body>
</html>
